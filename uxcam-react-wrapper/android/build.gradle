
buildscript {
    ext.safeExtGet = {prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.2.2'
    }
}

def isNewArchitectureEnabled() {
    return project.hasProperty("newArchEnabled") && project.newArchEnabled == "true"
}

apply plugin: 'com.android.library'
if (isNewArchitectureEnabled()) {
    apply plugin: 'com.facebook.react'
}

android {
    namespace "com.uxcam"
    compileSdkVersion safeExtGet('compileSdkVersion', 33)
    buildToolsVersion safeExtGet('buildToolsVersion', "33.0.1")

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 21)
        targetSdkVersion safeExtGet('targetSdkVersion', 33)
        versionCode 1
        versionName "1.0"
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    }
    lintOptions {
        abortOnError false
    }

    sourceSets {
        main {
            if (isNewArchitectureEnabled()) {
                java.srcDirs += ['src/newarch']
            } else {
                java.srcDirs += ['src/oldarch']
            }
        }
    }
}

repositories {
    maven {
        // All of React Native (JS, Obj-C sources, Android binaries) is installed from npm
        url "$projectDir/../node_modules/react-native/android"
    }
    mavenCentral()
}

// PREVIEW BUILD -- improved WebView capture.
//
// The Android build carrying the WebView occlusion hardening is not on Maven
// Central yet. It is served from UXCam's own public Maven repository
// (sdk.uxcam.com/android, the SDK's standard "Public" publishing target),
// where only this exact prerelease coordinate resolves it. Injecting the
// repository here means the host app needs no build.gradle changes.
//
// Drop this repository and restore the released coordinate before merging back
// to develop.
def uxcamPublicMavenUrl = "https://sdk.uxcam.com/android"

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url uxcamPublicMavenUrl
            content {
                includeGroup "com.uxcam"
            }
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation 'com.uxcam:uxcam:3.10.9-webview.1'
}

if (isNewArchitectureEnabled()) {
     react {
         jsRootDir = file("../src/")
         libraryName = "RNUxcam"
         codegenJavaPackageName = "com.uxcam"
    }
}
